name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ https://ppjlkdgqrwsyuhcxuahw.supabase.co }}
          KEY: ${{ eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwamxrZGdxcndzeXVoY3h1YWh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTQzMDYsImV4cCI6MjEwMzQ3MDMwNn0.GmD5A_Eadjpt5FK4XgAqrbwnw5qooIMn5M_qpOfMZIM }}
        run: |
          echo "Pinging Supabase..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${URL}/rest/v1/" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Supabase is alive!"
          else
            echo "Got status $STATUS — check your URL and key"
            exit 1
          fi
